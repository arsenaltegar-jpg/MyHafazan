<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyHafazan – Log Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple: #6B21A8;
    --purple-light: #7C3AED;
    --purple-dark: #4C1D95;
    --purple-glow: #A78BFA;
    --green: #16A34A;
    --green-light: #22C55E;
    --gold: #D97706;
    --white: #FFFFFF;
    --slate-50: #F8FAFC;
    --slate-100: #F1F5F9;
    --slate-200: #E2E8F0;
    --slate-600: #475569;
    --slate-800: #1E293B;
    --slate-900: #0F172A;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--slate-900);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated background */
  .bg-orbs { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: 0.15;
    animation: float 8s ease-in-out infinite;
  }
  .orb-1 { width: 500px; height: 500px; background: var(--purple); top: -100px; left: -100px; animation-delay: 0s; }
  .orb-2 { width: 400px; height: 400px; background: var(--green); bottom: -80px; right: -80px; animation-delay: -4s; }
  .orb-3 { width: 300px; height: 300px; background: var(--purple-glow); top: 50%; left: 50%; animation-delay: -2s; opacity: 0.08; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -30px) scale(1.05); }
    66% { transform: translate(-20px, 20px) scale(0.95); }
  }

  .bg-pattern {
    position: fixed; inset: 0; z-index: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
    background-size: 40px 40px;
  }

  /* Card */
  .login-wrapper {
    position: relative; z-index: 10;
    width: 100%; max-width: 460px;
    padding: 20px;
  }

  .logo-area { text-align: center; margin-bottom: 32px; }

  .logo-icon {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, var(--purple), var(--purple-light));
    border-radius: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
    box-shadow: 0 0 40px rgba(107,33,168,0.4);
    position: relative;
  }
  .logo-icon::after {
    content: ''; position: absolute; inset: -2px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--purple-glow), transparent);
    z-index: -1;
  }
  .logo-icon i { font-size: 32px; color: white; }

  .logo-title {
    font-family: 'Amiri', serif; font-size: 28px;
    color: white; letter-spacing: 1px; margin-bottom: 4px;
  }
  .logo-title span { color: var(--purple-glow); }

  .logo-sub {
    font-size: 12px; color: rgba(255,255,255,0.4);
    letter-spacing: 3px; text-transform: uppercase;
  }

  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px; padding: 40px;
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
  }

  .card-title { font-size: 22px; font-weight: 700; color: white; margin-bottom: 6px; }
  .card-sub { font-size: 13px; color: rgba(255,255,255,0.45); margin-bottom: 28px; }

  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600;
    color: rgba(255,255,255,0.6); letter-spacing: 0.5px;
    margin-bottom: 8px; text-transform: uppercase;
  }
  .input-wrap { position: relative; }
  .input-wrap i {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%); color: rgba(255,255,255,0.3); font-size: 15px;
  }
  .field input {
    width: 100%; background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
    padding: 13px 14px 13px 42px; font-size: 14px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: white; outline: none; transition: all 0.2s;
  }
  .field input::placeholder { color: rgba(255,255,255,0.25); }
  .field input:focus {
    border-color: var(--purple-light); background: rgba(124,58,237,0.1);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
  }

  .btn-login {
    width: 100%;
    background: linear-gradient(135deg, var(--purple), var(--purple-light));
    color: white; border: none; border-radius: 12px; padding: 14px;
    font-size: 15px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.2s; box-shadow: 0 4px 20px rgba(107,33,168,0.4); margin-top: 8px;
  }
  .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(107,33,168,0.5); }
  .btn-login:active { transform: translateY(0); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* Google Sign-In Button */
  .btn-google {
    width: 100%; background: white; color: #1E293B;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 13px;
    font-size: 14px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: all 0.2s; margin-top: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .btn-google:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,0.3); background: #f8f8f8; }
  .btn-google:active { transform: translateY(0); }
  .btn-google svg { flex-shrink: 0; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .hidden { display: none !important; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .auth-error {
    background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 10px; padding: 10px 14px; color: #FCA5A5;
    font-size: 13px; margin-bottom: 16px;
  }

  .forgot-link { text-align: right; margin-top: -10px; margin-bottom: 18px; }
  .forgot-link button {
    background: none; border: none; cursor: pointer;
    color: var(--purple-glow); font-size: 12px;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .forgot-link button:hover { text-decoration: underline; }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 24px 0 4px; color: rgba(255,255,255,0.3); font-size: 12px;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1);
  }

  .divider-roles {
    display: flex; align-items: center; gap: 12px;
    margin: 20px 0 16px; color: rgba(255,255,255,0.2); font-size: 12px;
  }
  .divider-roles::before, .divider-roles::after {
    content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1);
  }

  .role-badges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .badge {
    padding: 4px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 600; border: 1px solid;
  }
  .badge-admin { color: #C4B5FD; border-color: rgba(196,181,253,0.3); background: rgba(196,181,253,0.08); }
  .badge-teacher { color: #86EFAC; border-color: rgba(134,239,172,0.3); background: rgba(134,239,172,0.08); }
  .badge-parent { color: #FCD34D; border-color: rgba(252,211,77,0.3); background: rgba(252,211,77,0.08); }

  .footer-text { text-align: center; margin-top: 24px; font-size: 11px; color: rgba(255,255,255,0.2); }

  @media (max-width: 480px) {
    body { align-items: flex-start; padding: 0; }
    .login-wrapper { padding: 24px 16px 40px; max-width: 100%; }
    .logo-area { margin-bottom: 24px; }
    .logo-icon { width: 60px; height: 60px; border-radius: 16px; }
    .logo-icon i { font-size: 26px; }
    .logo-title { font-size: 24px; }
    .card { padding: 24px 18px; border-radius: 18px; }
    .card-title { font-size: 19px; }
    .field input { font-size: 16px; /* prevent iOS zoom */ }
    .btn-login { padding: 15px; font-size: 15px; }
    .btn-google { padding: 14px; font-size: 14px; }
    .role-badges { gap: 6px; }
  }
</style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="bg-pattern"></div>

<div class="login-wrapper">
  <div class="logo-area">
    <div class="logo-icon"><i class="fas fa-book-quran"></i></div>
    <div class="logo-title">My<span>Hafazan</span></div>
    <div class="logo-sub"> Sistem Pengurusan Tahfiz</div>
  </div>

  <div class="card">
    <div class="card-title">Selamat Datang</div>
    <div class="card-sub">Log masuk untuk meneruskan sesi anda</div>

    <div id="authError" class="auth-error hidden"></div>

    <form id="loginForm">
      <div class="field">
        <label>Emel</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" id="emailInput" placeholder="nama@sekolah.edu.my" required autocomplete="email" />
        </div>
      </div>

      <div class="field">
        <label>Kata Laluan</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="passwordInput" placeholder="••••••••" required autocomplete="current-password" />
        </div>
      </div>

      <div class="forgot-link">
        <button type="button" id="forgotPasswordBtn">Lupa kata laluan?</button>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <div class="spinner hidden" id="loginSpinner"></div>
        <i class="fas fa-right-to-bracket"></i>
        Log Masuk
      </button>
    </form>

    <!-- Google Sign-In -->
    <div class="divider">atau</div>
    <button type="button" class="btn-google" id="googleSignInBtn">
      <svg width="18" height="18" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Log Masuk dengan Google
    </button>

    <div class="divider-roles">Akses mengikut peranan</div>
    <div class="role-badges">
      <span class="badge badge-admin"><i class="fas fa-shield-halved"></i> Admin</span>
      <span class="badge badge-teacher"><i class="fas fa-chalkboard-user"></i> Murabbi</span>
      <span class="badge badge-parent"><i class="fas fa-users"></i> Ibu Bapa</span>
    </div>
  </div>

  <div class="footer-text">© 2025 MyHafazan Hak cipta terpelihara.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', initLoginPage);
</script>
</body>
</html>
